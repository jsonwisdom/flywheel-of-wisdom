name: Store SQLite Ledger (source-only)
on:
  push:
    paths:
      - 'store/machinery/durable/**'
      - '.github/workflows/store-sqlite-ledger.yml'
  pull_request:
    paths:
      - 'store/machinery/durable/**'
      - '.github/workflows/store-sqlite-ledger.yml'
permissions:
  contents: read
jobs:
  sqlite-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test store/machinery/durable/sqlite-ledger.test.mjs
