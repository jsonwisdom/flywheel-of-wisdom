name: CWaaS synthetic terms and lifecycle
on:
  push:
    branches: [review/cwaas-terms-lifecycle-20261105]
  pull_request:
    paths:
      - 'review/cwaas-terms-lifecycle/**'
      - '.github/workflows/cwaas-terms-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validation dependency
        run: python -m pip install -r review/cwaas-terms-lifecycle/requirements.txt
      - name: Run terms, catalog and lifecycle tests offline
        working-directory: review/cwaas-terms-lifecycle
        run: python -m unittest -v test_terms test_lifecycle
