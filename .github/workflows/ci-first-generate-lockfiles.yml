name: CI-FIRST Generate Lockfile Candidates
on:
  push:
    paths:
      - ".github/workflows/ci-first-generate-lockfiles.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate-only-no-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16.0"
      - name: Generate candidate lockfiles without installing or executing scripts
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --package-lock=true
          (cd tests/x402-lifecycle && npm install --package-lock-only --ignore-scripts --no-audit --no-fund --package-lock=true)
          (cd services/x402-v2 && npm install --package-lock-only --ignore-scripts --no-audit --no-fund --package-lock=true)
          python3 - <<'PY'
          import json
          for path in ["package-lock.json","tests/x402-lifecycle/package-lock.json","services/x402-v2/package-lock.json"]:
              o=json.load(open(path))
              assert o["lockfileVersion"]>=3, path
              print(path, "packages", len(o["packages"]))
          PY
          sha256sum package-lock.json tests/x402-lifecycle/package-lock.json services/x402-v2/package-lock.json
      - name: Save exact generated lockfiles as separate review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-first-lockfile-candidates
          if-no-files-found: error
          path: |
            package-lock.json
            tests/x402-lifecycle/package-lock.json
            services/x402-v2/package-lock.json
