name: Commercial Audit First (funds disabled)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'
  pull_request:
    paths:
      - 'server.ts'
      - 'STATUS.json'
      - 'services/x402-v2/**'
      - 'scripts/commercial_audit.py'
      - '.github/workflows/commercial-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit static product and revenue evidence, no secrets or payments
        run: python scripts/commercial_audit.py
      - name: Persist report even when audit needs repair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-audit-first
          path: commercial-readiness.json
          if-no-files-found: warn
          retention-days: 30
