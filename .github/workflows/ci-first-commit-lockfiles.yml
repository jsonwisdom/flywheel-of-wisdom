name: CI-FIRST Commit Verified Dependency Lockfiles (One-Time)
on:
  push:
    paths:
      - ".github/workflows/ci-first-commit-lockfiles.yml"
permissions:
  contents: write
jobs:
  generate-lockfiles-on-repair-branch:
    if: github.ref == 'refs/heads/ci-first/pc-settlement-hardening-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16.0"
      - name: Recompute lockfiles without installing packages, lifecycle scripts, or secrets
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          (cd tests/x402-lifecycle && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          (cd services/x402-v2 && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          sha256sum package-lock.json tests/x402-lifecycle/package-lock.json services/x402-v2/package-lock.json
      - name: Commit lockfiles ONLY to the dedicated repair branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json tests/x402-lifecycle/package-lock.json services/x402-v2/package-lock.json
          git diff --cached --quiet && exit 0
          test "$(git branch --show-current)" = "ci-first/pc-settlement-hardening-20261109"
          git commit -m "ci-first: lock npm dependency trees for reproducible ci"
          git push origin HEAD:refs/heads/ci-first/pc-settlement-hardening-20261109
