name: Flywheel CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-replay:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.9"

      - name: Set up Node for read-only x402 challenge checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16.0"

      - name: CI-FIRST audit immutable GitHub Action references
        run: |
          node --test scripts/audit/action-pin-check.test.mjs
          node scripts/audit/action-pin-check.mjs .github/workflows/ci.yml

      - name: Install production mainnet dependencies (no secrets)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify mainnet import compatibility (no keys, no payment)
        run: npm run check:imports

      - name: Verify production Node ESM relative import graph (no keys, no payment)
        run: npm run check:esm

      - name: Test CI-FIRST PC wallet policy and audit guards (no funds)
        run: node --test scripts/audit/pc-settlement-policy.test.mjs

      - name: Test isolated Base verification + reconciliation scenarios (MOCK, no funds)
        run: npx --no-install tsx src/payment/payment-rail.test.ts

      - name: Test x402 v2 challenge parser (no payment)
        run: node --test scripts/x402-challenge-audit.test.mjs

      - name: Install isolated x402 v2.29.0 lifecycle-test dependencies
        working-directory: tests/x402-lifecycle
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test real x402 core and Express settlement lifecycle (MOCK, no funds)
        working-directory: tests/x402-lifecycle
        run: npm test

      - name: Install funds-disabled Base Sepolia SQLite service dependencies
        working-directory: services/x402-v2
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify gated service syntax (no keys or funds)
        working-directory: services/x402-v2
        run: npm run check

      - name: Test transaction-bound receipts and x402 version/scheme regression (MOCK ONLY)
        working-directory: services/x402-v2
        run: |
          npm test
          echo "REGRESSION EXIT: 0"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run test suite (includes replay-verification and tamper-detection tests)
        run: python test_flywheel.py -v

      - name: Run the synthetic demo end to end
        run: python flywheel.py

      - name: Independently re-verify replay on the freshly generated receipt
        run: |
          python -c "
          import json, flywheel
          ledger = json.load(open('talley_synthetic.json'))
          assert ledger['is_mock'] is True, 'talley must stay marked mock'
          print('CI-side check: talley is_mock =', ledger['is_mock'])
          "

      - name: Upload generated receipts and talley as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flywheel-synthetic-output
          path: |
            receipts/
            talley_synthetic.json
